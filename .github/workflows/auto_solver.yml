name: Auto-solve Daily LeetCode Problem

on:
  schedule:
    - cron: '1 0 * * *' # Runs daily at 00:01 UTC
  workflow_dispatch: # Allows for manual triggering

jobs:
  auto-solve:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'shubhamsavarn'

    permissions:
      contents: write  # Required to push commits back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Run auto-solver
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python auto_solver.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-solve daily LeetCode problem"
          branch: main
          file_pattern: problems/*/gpt5-mini.md
